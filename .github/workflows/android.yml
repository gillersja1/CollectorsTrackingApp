name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# One build per branch at a time: a newer push cancels the older run, so an older
# build can never finish last and overwrite the "latest" APK with older code.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Needed so the job can publish the APK as a GitHub Release
      contents: write
    steps:
    - uses: actions/checkout@v5
    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Run unit tests with coverage
      # Includes Robolectric-based Room tests, which run on the JVM.
      run: ./gradlew testDebugUnitTest createDebugUnitTestCoverageReport
    - name: Upload test and coverage reports
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: unit-test-reports
        path: |
          app/build/reports/tests/testDebugUnitTest
          app/build/reports/coverage/test/debug
    - name: Build Debug APK
      run: ./gradlew assembleDebug
    - name: Publish APK to the "latest" GitHub Release
      # Only after a successful build on main, never on pull requests.
      # Replaces the previous build, so there is always exactly one APK and
      # nothing is committed to the repo.
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release delete latest --yes --cleanup-tag || true
        gh release create latest app/build/outputs/apk/debug/app-debug.apk \
          --title "Latest build" \
          --notes "Debug APK built from ${GITHUB_SHA::7} after CI passed." \
          --target "$GITHUB_SHA"
