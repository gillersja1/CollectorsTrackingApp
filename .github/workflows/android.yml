name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# One build per branch at a time: a newer push cancels the older run, so an older
# build can never finish last and overwrite the "latest" APK with older code.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Needed so the job can publish the APK as a GitHub Release
      contents: write
    steps:
    - uses: actions/checkout@v5
    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Run unit tests with coverage
      # Includes Robolectric-based Room tests, which run on the JVM.
      run: ./gradlew testDebugUnitTest createDebugUnitTestCoverageReport
    - name: Send test results to Grafana
      if: always()
      uses: gillersja1/test-results-otel@v1
      with:
        results: app/build/test-results/testDebugUnitTest/*.xml
        suite: unit
        otlp-endpoint: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
        otlp-headers: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
    - name: Upload test and coverage reports
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: unit-test-reports
        path: |
          app/build/reports/tests/testDebugUnitTest
          app/build/reports/coverage/test/debug
    - name: Lint
      # Findings that predate this check are listed in app/lint-baseline.xml; a new one fails the build.
      run: ./gradlew lintDebug
    - name: Upload lint report
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: lint-report
        path: |
          app/build/reports/lint-results-debug.html
          app/build/reports/lint-results-debug.sarif
    - name: Build Debug APK
      run: ./gradlew assembleDebug
    - name: Publish APK to the "latest" GitHub Release
      # Only after a successful build on main, never on pull requests.
      # Replaces the previous build, so there is always exactly one APK and
      # nothing is committed to the repo.
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release delete latest --yes --cleanup-tag || true
        gh release create latest app/build/outputs/apk/debug/app-debug.apk \
          --title "Latest build" \
          --notes "Debug APK built from ${GITHUB_SHA::7} after CI passed." \
          --target "$GITHUB_SHA"

  # The Firestore security rules, tested against the Firebase emulator. Separate from
  # the Android build so a rules failure shows up on its own, and it never needs the real project.
  security-rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'
    - uses: actions/setup-node@v5
      with:
        node-version: lts/*
        cache: npm
        cache-dependency-path: firebase/package-lock.json
    - run: npm ci
    - name: Run the rules tests on the emulators
      run: npx firebase emulators:exec --project demo-collectors --config ../firebase.json --only firestore "node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=rules-results.xml tests/rules.test.js"
    - name: Send test results to Grafana
      if: always()
      uses: gillersja1/test-results-otel@v1
      with:
        results: firebase/rules-results.xml
        suite: security-rules
        otlp-endpoint: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
        otlp-headers: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}

  # The app end to end on an Android emulator, against the Firebase Auth and Firestore emulators
  # (with this repo's security rules), so it never touches the real project.
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v5
    - name: Enable KVM, so the Android emulator runs at full speed
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
    - uses: actions/setup-node@v5
      with:
        node-version: lts/*
        cache: npm
        cache-dependency-path: firebase/package-lock.json
    - name: Install the Firebase emulators
      working-directory: firebase
      run: npm ci
    - name: Build the app and its UI tests
      run: chmod +x gradlew && ./gradlew assembleDebug assembleDebugAndroidTest
    - name: Run the UI tests on an Android emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        target: google_apis
        arch: x86_64
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
        script: cd firebase && npx firebase emulators:exec --project collectorsapp-90a46 --config ../firebase.json --only auth,firestore "cd .. && ./gradlew connectedDebugAndroidTest"
    - name: Send test results to Grafana
      if: always()
      uses: gillersja1/test-results-otel@v1
      with:
        results: app/build/outputs/androidTest-results/connected/debug/*.xml
        suite: ui
        otlp-endpoint: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
        otlp-headers: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
    - name: Upload UI test reports
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: ui-test-reports
        path: |
          app/build/reports/androidTests/connected
          app/build/outputs/androidTest-results/connected
